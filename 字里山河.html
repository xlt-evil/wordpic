:root{--paper:#eee8d9;--ink:#221f1c;--red:#aa1e26;--soft:#8a8274}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;color:var(--ink);
  font-family:"XW","Songti SC","Noto Serif SC","STSong",serif;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:text}
#seal{position:fixed;left:22px;top:20px;background:var(--red);color:#f4ecdc;font-family:"MSZ",serif;
  font-size:22px;line-height:1.05;padding:6px 6px 5px;border-radius:4px;writing-mode:vertical-rl;height:60px;
  letter-spacing:1px;pointer-events:none;opacity:.94}
#bar{position:fixed;right:20px;top:20px;display:flex;gap:8px}
#bar button{font:inherit;font-size:14px;letter-spacing:3px;padding:5px 9px 5px 12px;border-radius:999px;
  border:1px solid #b9b09c;background:rgba(244,239,226,.75);color:#3a3530;cursor:pointer}
#bar button:hover{border-color:#6d6558}
#bar button.on{background:var(--red);border-color:var(--red);color:#f6eedf}
#bar button:focus-visible,.chip:focus-visible,.cand:focus-visible{outline:2px solid var(--red);outline-offset:2px}
#list{position:fixed;right:26px;top:70px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;pointer-events:none}
#list .row{display:flex;align-items:center;gap:8px;animation:rowin .4s ease both}
#list .py{font:12px Georgia,"Times New Roman",serif;color:#a0463f}
#list .ch{font:30px/1.12 "MSZ",serif}
#list .end{background:var(--red);color:#f4ecdc;font:19px/1.05 "MSZ",serif;writing-mode:vertical-rl;padding:5px 4px;border-radius:3px;margin-top:6px}
@keyframes rowin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#panel{position:fixed;right:20px;top:62px;width:min(340px,calc(100vw - 40px));background:rgba(248,244,233,.97);
  border:1px solid #c9c0ab;border-radius:12px;padding:14px;box-shadow:0 10px 30px rgba(60,50,30,.16);display:none;z-index:5}
#panel.open{display:block}
#panel h2{margin:0 0 10px;font-size:14px;font-weight:400;letter-spacing:3px;color:var(--soft)}
#chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{font:inherit;border:1px solid #d3cab6;background:#fbf8ef;border-radius:8px;padding:6px 0 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.chip:hover{border-color:var(--red)}
.chip b{font:400 30px/1.1 "MSZ",serif}
.chip i{font:normal 12px Georgia,serif;color:#a0463f}
#dock{position:fixed;left:0;right:0;bottom:calc(5vh + 4px);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#cands{display:flex;gap:2px;background:#fdfbf6;border:1px solid #c8c0b0;border-radius:10px;padding:4px;
  box-shadow:0 4px 10px rgba(60,50,40,.14);pointer-events:auto;visibility:hidden}
#cands.show{visibility:visible}
.cand{font:inherit;border:0;background:none;border-radius:7px;padding:3px 9px 3px 7px;cursor:pointer;display:flex;align-items:baseline;gap:5px;color:#3c3834}
.cand small{font:11px Georgia,serif;color:#968f84}
.cand b{font:400 26px/1.15 "MSZ",serif}
.cand.first{background:#2e2a26;color:#faf6ec}.cand.first small{color:#dcd4c4}
#keys{display:flex;gap:6px;height:54px;transition:opacity .35s}
#keys.fade{opacity:0}
#keys.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.key{width:50px;height:50px;border-radius:11px;background:#24211e;color:#f2ecde;font:700 24px/50px Georgia,"Times New Roman",serif;
  text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.22);animation:keyin .14s ease-out both}
@keyframes keyin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;bottom:calc(5vh + 140px);transform:translateX(-50%);background:rgba(36,33,30,.9);color:#f2ecde;
  font-size:15px;letter-spacing:2px;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;
  max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1}
#intro{position:fixed;left:0;right:0;top:36%;text-align:center;pointer-events:none;transition:opacity .8s;padding:0 20px}
#intro.hide{opacity:0}
#intro h1{font:400 clamp(40px,7vw,92px)/1.1 "MSZ",serif;letter-spacing:.18em;margin:0 0 .25em .18em;color:#2a2622}
#intro p{margin:.5em 0;font-size:clamp(15px,1.5vw,21px);letter-spacing:.32em;color:#4a443d}

<body>
<canvas id="cv" aria-label="水墨画纸"></canvas>
<div id="seal">字里山河</div>
<div id="intro">
  <h1>字里山河</h1>
  <p>敲下一个汉字，纸上便生出一方山河</p>
  <p class="s">点一下纸面，直接敲拼音（如 shan），或用中文输入法打字</p>
  <p class="s" id="avail"></p>
</div>
<div id="bar">
  <button id="bDemo" type="button">演示</button>
  <button id="bList" type="button" aria-expanded="false">字表</button>
  <button id="bClear" type="button">清纸</button>
  <button id="bSound" type="button" aria-pressed="false">无声</button>
</div>
<div id="list" aria-live="polite"></div>
<div id="panel" role="dialog" aria-label="字表"><h2>可入画的字</h2><div id="chips"></div></div>
<div id="dock"><div id="cands"></div><div id="keys"></div></div>
<div id="toast" role="status"></div>
<input id="ime" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="输入汉字">
<script>
(()=>{
'use strict';
const W=1920,H=1080,TAU=Math.PI*2;
const PRESETS=[
 {ch:'山',py:'shan',tone:'shān',pos:[1050,440],col:[38,50,60],notes:[146.83,220]},
 {ch:'竹',py:'zhu',tone:'zhú',pos:[360,470],col:[28,62,44],notes:[220,261.63,293.66]},
 {ch:'舟',py:'zhou',tone:'zhōu',pos:[960,790],col:[28,26,24],notes:[196,293.66]},
 {ch:'月',py:'yue',tone:'yuè',pos:[1560,205],col:[196,134,40],notes:[349.23,440]},
 {ch:'鹤',py:'he',tone:'hè',pos:[1250,340],col:[172,32,40],notes:[293.66,261.63,220,392]},
 {ch:'雪',py:'xue',tone:'xuě',pos:[800,180],col:[70,102,130],notes:[440,587.33,523.25]},
 {ch:'云',py:'yun',tone:'yún',pos:[620,210],col:[84,96,108],notes:[261.63,392]},
 {ch:'雨',py:'yu',tone:'yǔ',pos:[1100,170],col:[40,90,110],notes:[392,349.23,293.66]},
 {ch:'鱼',py:'yu',tone:'yú',pos:[720,900],col:[28,26,24],notes:[196,220,293.66]},
 {ch:'梅',py:'mei',tone:'méi',pos:[1500,520],col:[172,32,40],notes:[293.66,349.23,440]},
 {ch:'风',py:'feng',tone:'fēng',pos:[900,330],col:[60,70,80],notes:[174.61,261.63]},
];
const BYCH=Object.fromEntries(PRESETS.map(p=>[p.ch,p]));
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const sstep=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=Math.random;
const U=(r,a,b)=>a+(b-a)*r();
function mk(w,h){const c=document.createElement('canvas');c.width=Math.ceil(w);c.height=Math.ceil(h);return c}
function noise1(r,k){const v=Array.from({length:k+2},()=>r()-.5);return u=>{const f=u*k,i=Math.floor(f),t=f-i;return v[i]*(1-t)+v[i+1]*t}}
function samplePts(c,n,scale){
  const g=c.getContext('2d'),d=g.getImageData(0,0,c.width,c.height).data,out=[];let tries=0;
  while(out.length<n&&tries<n*400){tries++;const x=Math.random()*c.width|0,y=Math.random()*c.height|0;
    if(d[(y*c.width+x)*4+3]/255>Math.random()*.9)out.push([x/scale,y/scale])}
  while(out.length<n)out.push([c.width/2/scale,c.height/2/scale]);
  return out}

/* ---------- paper ---------- */
const PAPER=(()=>{const c=mk(960,540),g=c.getContext('2d');g.fillStyle='#eee8d9';g.fillRect(0,0,960,540);
  const r=rng(11);
  for(let i=0;i<26;i++){const x=r()*960,y=r()*540,rad=90+r()*200,gr=g.createRadialGradient(x,y,0,x,y,rad);
    const dark=r()<.5;gr.addColorStop(0,dark?'rgba(120,105,80,.022)':'rgba(255,252,240,.05)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,960,540)}
  const id=g.getImageData(0,0,960,540),d=id.data;
  for(let i=0;i<d.length;i+=4){const n=(r()-.5)*7;d[i]+=n;d[i+1]+=n;d[i+2]+=n}
  g.putImageData(id,0,0);
  g.globalAlpha=.05;g.strokeStyle='#6a5f4a';g.lineWidth=.6;
  for(let i=0;i<260;i++){const x=r()*960,y=r()*540,l=8+r()*30;g.beginPath();g.moveTo(x,y);g.lineTo(x+l,y+(r()-.5)*3);g.stroke()}
  g.globalAlpha=1;const v=g.createRadialGradient(480,270,200,480,270,620);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(90,75,50,.13)');g.fillStyle=v;g.fillRect(0,0,960,540);
  return c})();

/* ---------- sprites ---------- */
const MC=[50,62,72],MH=470,MY0=250;
function buildMount(seed,layers,fadeL){
  const r=rng(seed),c=mk(W,MH),g=c.getContext('2d');
  for(const [peaks,base,s,fall] of layers){
    const k1=noise1(r,14),k2=noise1(r,48),k3=noise1(r,150);
    for(let x=0;x<W;x+=2){let h=0;for(const [cx,ht,wd] of peaks)h=Math.max(h,ht*Math.pow(Math.max(0,1-Math.abs(x-cx)/wd),1.25));
      const n=44*k1(x/W)+20*k2(x/W)+8*k3(x/W),y=base-h-n*(.35+h/240),L=fall*3.1;
      const gr=g.createLinearGradient(0,y,0,y+L);gr.addColorStop(0,rgba(MC,s));gr.addColorStop(.05,rgba(MC,s*.72));gr.addColorStop(.4,rgba(MC,s*.26));gr.addColorStop(1,rgba(MC,0));
      g.fillStyle=gr;g.fillRect(x,y,2,L)}}
  g.globalCompositeOperation='destination-out';
  for(let i=0;i<5000;i++){g.fillStyle=`rgba(0,0,0,${.03+r()*.07})`;g.beginPath();g.arc(r()*W,r()*MH,.6+r()*2.6,0,TAU);g.fill()}
  let gr=g.createLinearGradient(fadeL,0,fadeL+480,0);gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,fadeL+480,MH);
  gr=g.createLinearGradient(0,MH-120,0,MH);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,1)');g.fillStyle=gr;g.fillRect(0,MH-120,W,120);
  return {c,w:W,h:MH,s:1,pts:samplePts(c,1500,1)}}
const MOUNT=[
 buildMount(21,[[[[880,150,300],[1230,215,330],[1640,165,330]],330,.34,120],[[[1080,140,250],[1490,235,300],[1860,200,260]],385,.56,95],[[[1720,150,290],[1360,85,230],[700,60,260]],425,.78,70]],330),
 buildMount(37,[[[[420,120,300],[760,190,300]],350,.26,110],[[[250,150,260],[620,110,240],[980,70,260]],410,.4,80]],-480)];

const SP=1.5;
function buildBamboo(seed){
  const BW=720,BH=1130,c=mk(BW*SP,BH*SP),g=c.getContext('2d'),r=rng(seed);g.scale(SP,SP);
  const col=a=>`rgba(30,48,38,${a})`;
  function leaf(cx,cy,ang,L,a){g.save();g.translate(cx,cy);g.rotate(ang);g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(L*.32,-L*.17,L,L*.05);g.quadraticCurveTo(L*.42,L*.13,0,0);g.fillStyle=col(a);g.fill();g.restore()}
  function cluster(cx,cy,side,n,scale){n=n||4+(r()*3|0);scale=scale||1;
    for(let i=0;i<n;i++){const ang=(90-side*U(r,-15,62)+(i-n/2)*U(r,8,16)*side)*Math.PI/180;
      leaf(cx+U(r,-8,8),cy+U(r,-8,8),ang,U(r,85,150)*scale,[.94,.92,.88,.78,.58,.46][r()*6|0])}}
  const stalks=[[270,95,21,-30,.9],[165,-45,15,110,.74],[385,175,12,210,.58]];
  for(const [xb,bend,w0,top,val] of stalks){
    const sx=y=>xb+bend*Math.pow((BH-y)/BH,2);let y1=BH,seg=U(r,135,170);
    while(y1>top){const y0=Math.max(y1-seg,top),u=(BH-(y0+y1)/2)/BH,w=w0*(1-.38*u),ym=(y0+y1)/2;
      g.fillStyle=col(val);g.beginPath();g.moveTo(sx(y1)-w/2,y1);g.lineTo(sx(ym)-w/2*.84,ym);g.lineTo(sx(y0)-w/2,y0);g.lineTo(sx(y0)+w/2,y0);g.lineTo(sx(ym)+w/2*.84,ym);g.lineTo(sx(y1)+w/2,y1);g.fill();
      g.strokeStyle=col(.98);g.lineWidth=3;g.beginPath();g.moveTo(sx(y0)-w/2-3,y0-2);g.lineTo(sx(y0)+w/2+3,y0-3);g.stroke();
      if(u>.22&&r()<.75){const side=r()<.5?-1:1,ang=U(r,35,58)*Math.PI/180,L=U(r,90,170),ex=sx(y0)+side*Math.cos(ang)*L,ey=y0-Math.sin(ang)*L;
        g.strokeStyle=col(.84);g.lineWidth=3;g.beginPath();g.moveTo(sx(y0),y0);g.lineTo(ex,ey);g.stroke();cluster(ex,ey,side);
        if(r()<.6)cluster((sx(y0)+ex)/2,(y0+ey)/2,side,3,.8)}
      y1=y0-7;seg*=.965}
    if(top>0){cluster(sx(top),top,1,0,.9);cluster(sx(top),top,-1,4,.9)}}
  g.globalCompositeOperation='destination-out';
  for(let i=0;i<900;i++){g.strokeStyle=`rgba(0,0,0,${.05+r()*.22})`;g.lineWidth=.6+r()*1.2;const x=r()*BW,y=r()*BH,l=30+r()*120;g.beginPath();g.moveTo(x,y);g.lineTo(x+(r()-.5)*4,y+l);g.stroke()}
  return {c,w:BW,h:BH,s:SP,pts:samplePts(c,1500,SP)}}
const BAMBOO=buildBamboo(52);

function buildBoat(){
  const w=380,h=200,S=2,c=mk(w*S,h*S),g=c.getContext('2d');g.scale(S,S);
  const ytop=x=>128-22*Math.pow(Math.abs((x-190)/170),2.2),ybot=x=>ytop(x)+30*(1-Math.pow(Math.abs((x-190)/170),3));
  g.fillStyle='rgba(30,28,26,.6)';g.strokeStyle='rgba(30,28,26,.94)';g.lineWidth=2;
  g.beginPath();for(let x=118;x<=226;x+=2){const y=ytop(x)-48*Math.sqrt(Math.max(0,1-Math.pow((x-172)/54,2)));x===118?g.moveTo(x,y):g.lineTo(x,y)}g.lineTo(226,ytop(226)+2);g.lineTo(118,ytop(118)+2);g.closePath();g.fill();g.stroke();
  g.lineWidth=1;for(let k=1;k<7;k++){const x=118+k*108/7;g.beginPath();g.moveTo(x,ytop(x)-48*Math.sqrt(Math.max(0,1-Math.pow((x-172)/54,2)))+2);g.lineTo(x,ytop(x));g.stroke()}
  g.fillStyle='rgba(30,28,26,.95)';g.beginPath();for(let x=20;x<=360;x+=4)x===20?g.moveTo(x,ytop(x)):g.lineTo(x,ytop(x));for(let x=360;x>=20;x-=4)g.lineTo(x,ybot(x));g.fill();
  const fx=288,fy=ytop(fx);
  g.fillStyle='rgba(176,34,42,.96)';g.beginPath();g.moveTo(fx-10,fy+1);g.lineTo(fx+10,fy+1);g.lineTo(fx+6,fy-32);g.lineTo(fx-6,fy-32);g.fill();
  g.fillStyle='rgba(30,28,26,.95)';g.beginPath();g.arc(fx,fy-38,5,0,TAU);g.fill();
  g.beginPath();g.moveTo(fx-18,fy-40);g.lineTo(fx+18,fy-40);g.lineTo(fx,fy-53);g.fill();
  g.strokeStyle='rgba(30,28,26,.9)';g.lineWidth=1.6;g.beginPath();g.moveTo(fx+4,fy-95);g.lineTo(fx+40,fy+50);g.stroke();
  g.lineWidth=3.5;g.beginPath();g.moveTo(fx-4,fy-26);g.lineTo(fx+16,fy-18);g.stroke();
  const r=rng(61);g.globalCompositeOperation='destination-out';
  for(let i=0;i<160;i++){g.strokeStyle=`rgba(0,0,0,${.05+r()*.2})`;g.lineWidth=.6;const x=20+r()*340,y=100+r()*60;g.beginPath();g.moveTo(x,y);g.lineTo(x+10+r()*30,y+(r()-.5)*2);g.stroke()}
  return {c,w,h,s:S,pts:samplePts(c,1300,S)}}
const BOAT=buildBoat();

function buildPlum(){
  const PW=780,PH=800,c=mk(PW*SP,PH*SP),g=c.getContext('2d'),r=rng(97);g.scale(SP,SP);g.lineCap='round';
  const fl=[];
  function br(x,y,ang,len,w,depth){const steps=6;let px=x,py=y;
    for(let i=0;i<steps;i++){ang+=(r()-.5)*.42;const nx=px+Math.cos(ang)*len/steps,ny=py+Math.sin(ang)*len/steps;
      g.strokeStyle=`rgba(36,30,28,${.92-depth*.06})`;g.lineWidth=Math.max(1.4,w*(1-i/steps*.4));g.beginPath();g.moveTo(px,py);g.lineTo(nx,ny);g.stroke();px=nx;py=ny;
      if(depth>=1&&r()<.62)fl.push([px+U(r,-12,12),py+U(r,-12,12),r()<.62,U(r,11,17)])}
    if(depth<3){br(px,py,ang-U(r,.35,.8),len*U(r,.55,.75),w*.58,depth+1);br(px,py,ang+U(r,.15,.55),len*U(r,.6,.8),w*.62,depth+1);
      if(depth===0)br(x+(px-x)*.45,y+(py-y)*.45,ang-U(r,.7,1.1),len*.55,w*.45,2)}
    else fl.push([px,py,true,U(r,12,17)])}
  br(PW+10,PH-300,Math.PI+.34,300,17,0);
  for(const [x,y,full,sz] of fl){
    if(full){for(let k=0;k<5;k++){const a=k*TAU/5+r();g.fillStyle=`rgba(${186+r()*20|0},${36+r()*22|0},${50+r()*16|0},.86)`;g.beginPath();g.arc(x+Math.cos(a)*sz*.5,y+Math.sin(a)*sz*.5,sz*.46,0,TAU);g.fill()}
      g.fillStyle='rgba(110,16,26,.9)';for(let k=0;k<4;k++){g.beginPath();g.arc(x+(r()-.5)*sz*.4,y+(r()-.5)*sz*.4,1.3,0,TAU);g.fill()}}
    else{g.fillStyle='rgba(176,30,44,.9)';g.beginPath();g.arc(x,y,sz*.36,0,TAU);g.fill()}}
  return {c,w:PW,h:PH,s:SP,pts:samplePts(c,1400,SP),fl}}
const PLUM=buildPlum();const PS=.8;const PLUM_XY=[W+8-(PLUM.w+10)*PS,650-(PLUM.h-300)*PS];

function buildCloud(seed){const w=600,h=230,c=mk(w,h),g=c.getContext('2d'),r=rng(seed);
  for(let i=0;i<13;i++){const x=110+r()*380,y=80+r()*70,rad=60+r()*80;g.save();g.translate(x,y);g.scale(1,.5);
    const gr=g.createRadialGradient(0,0,0,0,0,rad);gr.addColorStop(0,'rgba(78,90,102,.2)');gr.addColorStop(.6,'rgba(78,90,102,.09)');gr.addColorStop(1,'rgba(78,90,102,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,rad,0,TAU);g.fill();g.restore()}
  g.strokeStyle='rgba(60,72,84,.2)';g.lineWidth=1.2;for(let i=0;i<4;i++){const x=120+r()*260,y=120+r()*50,l=90+r()*160;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+l/2,y+6,x+l,y);g.stroke()}
  return {c,w,h,s:1,pts:samplePts(c,1200,1)}}
const CLOUDS=[buildCloud(5),buildCloud(8),buildCloud(13)];

const dotCache={};
function dot(col){const k=col.join();if(dotCache[k])return dotCache[k];const c=mk(32,32),g=c.getContext('2d'),gr=g.createRadialGradient(16,16,0,16,16,16);
  gr.addColorStop(0,rgba(col,.85));gr.addColorStop(.5,rgba(col,.4));gr.addColorStop(1,rgba(col,0));g.fillStyle=gr;g.fillRect(0,0,32,32);return dotCache[k]=c}

/* ---------- world state ---------- */
let st;
function reset(){st={mounts:[],bamboos:[],boats:[],moon:null,cranes:[],clouds:[],fish:[],plum:null,snow:{on:false,k:0},rain:{on:false,k:0},windT:-99,
  petals:[],ripples:[],morphs:[],glyphs:[],water:0,wantWater:false}}
reset();
const SNOW=Array.from({length:340},()=>({x:R(),y:R(),v:55+R()*95,r:1.6+R()*3,ph:R()*TAU,dx:-28+R()*22,b:R()}));
const RAIN=Array.from({length:260},()=>({x:R(),y:R(),v:900+R()*600,l:22+R()*30,b:R(),a:.18+R()*.3}));
const WLINES=(()=>{const r=rng(71);return Array.from({length:26},()=>({x:U(r,-200,W),y:U(r,745,1060),l:U(r,140,520),a:U(r,.1,.26),ph:r()*TAU}))})();
const WISPS=Array.from({length:6},(_,i)=>({y:180+i*110+R()*60,ph:R()*TAU,sp:.75+R()*.5,w:5+R()*10,off:R()}));
let view={x0:0,x1:W,y0:0,y1:H};
const now=()=>performance.now()/1000;
const gust=t=>{const d=t-st.windT;return d<0||d>8?0:sstep(d/1.2)*(1-sstep((d-5.5)/2.5))};

const BOAT_SLOTS=[[780,690,1],[1260,640,.62],[470,770,.8]];
const BAMBOO_SLOTS=[[-50,-40,1,1],[250,230,.76,.62]];
function spawn(p){
  const t=now();let pos=p.pos.slice(),dst;const N=1400;
  const from=(spr,x,y,s)=>Array.from({length:N},(_,i)=>{const q=spr.pts[i%spr.pts.length];return[x+q[0]*s,y+q[1]*s]});
  const cloudPts=(cx,cy,sx,sy)=>Array.from({length:N},()=>[cx+(R()+R()+R()-1.5)*sx,cy+(R()+R()+R()-1.5)*sy]);
  switch(p.ch){
    case'山':{const i=Math.min(st.mounts.length,1);if(st.mounts.length<2)st.mounts.push({born:t+.6,i,gx:i?620:1050});pos=i?[620,470]:pos;dst=from(MOUNT[i],0,MY0,1);break}
    case'竹':{const i=Math.min(st.bamboos.length,1),s=BAMBOO_SLOTS[i];if(st.bamboos.length<2)st.bamboos.push({born:t+.6,x:s[0],y:s[1],sc:s[2],a:s[3],ph:i*1.7});
      pos=i?[560,640]:pos;dst=from(BAMBOO,s[0],s[1],s[2]);break}
    case'舟':{const i=st.boats.length%3,s=BOAT_SLOTS[i];if(st.boats.length<3)st.boats.push({born:t+.6,x:s[0],y:s[1],sc:s[2],ph:R()*TAU});
      const b=st.boats[i];const bx=boatX(b,t+1);pos=[bx+190*s[2],s[1]+110*s[2]];dst=from(BOAT,bx,s[1],s[2]);st.wantWater=true;break}
    case'月':{if(!st.moon)st.moon={born:t+.6};st.moon.pulse=t+.6;
      dst=Array.from({length:N},()=>{const a=R()*TAU,rr=R()<.55?92*Math.sqrt(R()):92+R()*70;return[1560+Math.cos(a)*rr,205+Math.sin(a)*rr]});break}
    case'鹤':{const n=st.cranes.length;const sc=[.95,.72,.56,.8,.64,.5][n%6];pos=[pos[0]+(n%3)*90-(n>2?260:0),pos[1]+((n*67)%140)-40];
      if(n<6)st.cranes.push({born:t+.75,x:pos[0]-150*sc,y:pos[1]-138*sc,sc,v:100+R()*34,ph:R()*TAU,dy:-.1-R()*.3,t0:t+.55});
      dst=cloudPts(pos[0]-30,pos[1],120*sc,50*sc);break}
    case'雪':st.snow.on=true;st.snow.t0=t+.5;st.rain.on=false;dst=Array.from({length:N},()=>[view.x0+R()*(view.x1-view.x0),R()*H*.9]);break;
    case'雨':st.rain.on=true;st.rain.t0=t+.5;st.snow.on=false;st.wantWater=true;dst=Array.from({length:N},()=>[view.x0+R()*(view.x1-view.x0),R()*H]);break;
    case'云':{const n=st.clouds.length;const y=[110,250,40,330][n%4],x=[420,1050,1300,160][n%4];pos=[x+300,y+115];

let AC=null,soundOn=false,master=null;

  const dl=AC.createDelay();dl.delayTime.value=.23;const fb=AC.createGain();fb.gain.value=.3;const lp=AC.createBiquadFilter();lp.frequency.value=1800;
  master.connect(AC.destination);master.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(AC.destination)}catch(e){AC=null}}
function pluck(f,when,amp){if(!soundOn||!AC)return;const t0=AC.currentTime+when;
  for(let k=1;k<=6;k++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(f*k*1.012,t0);o.frequency.exponentialRampToValueAtTime(f*k,t0+.12);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(amp/Math.pow(k,1.2),t0+.005);g.gain.exponentialRampToValueAtTime(.0001,t0+3.2/(.6+.45*k));o.connect(g);g.connect(master);o.start(t0);o.stop(t0+3.4)}}

function tick(){if(!soundOn||!AC)return;const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(1500,t0);o.frequency.exponentialRampToValueAtTime(700,t0+.04);
  g.gain.setValueAtTime(.12,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.06);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+.07)}

  if(buf)showKeys(buf);else if(!keysEl.dataset.keep){keysEl.textContent='';keysEl.dataset.s=''}}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2600)}
function shake(){keysEl.classList.remove('shake');void keysEl.offsetWidth;keysEl.classList.add('shake')}
function typeLetter(l){clearTimeout(autoT);const nb=buf+l;
  if(!PRESETS.some(p=>p.py.startsWith(nb))){shake();toast('预设里没有「'+nb+'」这个音 · 点「字表」看看可用的字');return}
  delete keysEl.dataset.keep;buf=nb;tick();renderDock();const c=cands();if(c.length===1&&c[0].py===buf)autoT=setTimeout(()=>commit(c[0]),420)}
function commit(p){clearTimeout(autoT);buf='';keysEl.dataset.keep='1';renderDock();showKeys(p.tone);fadeKeys(1500);setTimeout(()=>{delete keysEl.dataset.keep},1500);
  intro.classList.add('hide');panel.classList.remove('open');$('bList').setAttribute('aria-expanded','false');spawn(p);typed.push(p);renderList()}
function renderList(){listEl.textContent='';const show=typed.slice(-12);show.forEach((p,i)=>{const r=document.createElement('div');r.className='row';if(i<show.length-1)r.style.animation='none';
    r.innerHTML=`<span class="py">${p.tone}</span><span class="ch">${p.ch}</span>`;listEl.appendChild(r)});
  if(typed.length){const e=document.createElement('div');e.className='end';e.textContent='山河';listEl.appendChild(e)}}
function handleText(s){let k=0,bad=[];for(const ch of s){const p=BYCH[ch];if(p){setTimeout(()=>commit(p),k*650);k++}else if(/[㐀-鿿]/.test(ch))bad.push(ch)}
  if(bad.length)toast('「'+bad.slice(0,3).join('')+'」还没入画 · 可用：'+PRESETS.map(p=>p.ch).join(' '))}
function stopDemo(){demoT.forEach(clearTimeout);demoT=[]}
addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(e.target&&e.target.tagName==='BUTTON'&&(k===' '||k==='Enter')&&!buf)return;
  if(/^[a-zA-Z]$/.test(k)){e.preventDefault();stopDemo();typeLetter(k.toLowerCase())}
  else if(k==='Backspace'){if(buf){e.preventDefault();clearTimeout(autoT);buf=buf.slice(0,-1);renderDock()}}
  else if(k===' '||k==='Enter'){if(buf){e.preventDefault();const c=cands(),p=c.find(q=>q.py===buf)||c[0];if(p)commit(p)}}
  else if(/^[1-9]$/.test(k)&&buf){const p=cands()[+k-1];if(p){e.preventDefault();commit(p)}}
  else if(k==='Escape'){clearTimeout(autoT);buf='';renderDock();panel.classList.remove('open')}});
ime.addEventListener('compositionupdate',e=>{const s=(e.data||'').replace(/[^a-zA-Z]/g,'').toLowerCase().slice(0,8);if(s){delete keysEl.dataset.keep;showKeys(s)}});
ime.addEventListener('compositionend',e=>{const s=e.data||ime.value;ime.value='';keysEl.textContent='';keysEl.dataset.s='';handleText(s)});
ime.addEventListener('input',e=>{if(e.isComposing)return;const s=ime.value;ime.value='';handleText(s)});
cv.addEventListener('click',()=>{ime.focus({preventScroll:true});panel.classList.remove('open')});
$('bList').onclick=()=>{const o=panel.classList.toggle('open');$('bList').setAttribute('aria-expanded',o)};
$('bClear').onclick=()=>{stopDemo();reset();typed=[];renderList();buf='';renderDock();intro.classList.remove('hide');ime.focus({preventScroll:true})};
$('bSound').onclick=()=>{soundOn=!soundOn;if(soundOn){initAudio();if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})}
  $('bSound').textContent=soundOn&&AC?'有声':'无声';$('bSound').classList.toggle('on',soundOn&&!!AC);$('bSound').setAttribute('aria-pressed',soundOn&&!!AC);if(soundOn)pluck(293.66,0,.3)};
$('bDemo').onclick=()=>{stopDemo();let at=200;for(const ch of '山竹舟月鹤雪'){const p=BYCH[ch];[...p.py].forEach((l,i)=>demoT.push(setTimeout(()=>typeLetter(l),at+i*150)));
    demoT.push(setTimeout(()=>{if(buf===p.py)commit(p)},at+p.py.length*150+260));at+=2200}};
const chips=$('chips');PRESETS.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='chip';b.innerHTML=`<b>${p.ch}</b><i>${p.tone}</i>`;b.onclick=()=>{stopDemo();commit(p)};chips.appendChild(b)});

const start=()=>{requestAnimationFrame(frame);try{ime.focus({preventScroll:true})}catch(e){}};
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load('176px MSZ','山竹舟月鹤雪云雨鱼梅风'),document.fonts.load('16px XW','敲')]).catch(()=>{}):Promise.resolve()).then(start);
})();
</script>
</body>
